# ─── TUI Configuration ────────────────────────────────────────────────────────
# This file is read at startup. Change values and restart to apply.
#
# Available colour names (case-insensitive):
#   black, red, green, yellow, blue, magenta, cyan, white,
#   dark_gray, light_red, light_green, light_yellow, light_blue,
#   light_magenta, light_cyan, gray
# ──────────────────────────────────────────────────────────────────────────────

# Workspace root: the folder that contains templates/ and projects/.
# The TUI auto-detects this from the current working directory or by walking
# up from the binary. Only set this if auto-detection fails.
workspace_root = ~/Documents/LaTeX

# Extra project roots. The workspace's own <workspace_root>/projects/ is
# always included automatically; add one line per additional folder you
# want to browse/create into (e.g. university vs. personal writing).
# Format: "Label:/absolute/path" or just "/absolute/path" (folder name
# becomes the label). Repeat the key for more than one extra root.
# When more than one root is configured, "Open project", "Blank project",
# "Template selector", and "Convert to mindmap" will first ask which
# workspace to use. Within a root, folders are browsed recursively —
# a folder only becomes selectable once it directly contains files
# (e.g. main.tex); folders that just hold subfolders (like a semester
# or class folder) are drilled into instead.
# project_root = Uni:~/School/Latex/projects
project_root = Uni:~/Uni/latex-projects

# PDF viewer command called after a successful compile.
# The path to the PDF is appended as the final argument.
# Examples:
#   pdf_viewer = tdf             (shell alias, default)
#   pdf_viewer = open -a Skim
#   pdf_viewer = open -a Preview
#   pdf_viewer = zathura
#   pdf_viewer = mupdf
pdf_viewer = zathura

# LaTeX compiler command to use for building projects.
# The TUI runs the compiler twice to ensure references and TOC are resolved.
# Examples:
#   latex_compiler = pdflatex    (default, most common)
#   latex_compiler = latexmk     (handles dependencies automatically)
#   latex_compiler = xelatex     (for advanced fonts)
#   latex_compiler = lualatex    (modern Lua-based)
latex_compiler = pdflatex

# Editor choice for opening projects.
# Options: nvim, vscode
editor = nvim

# Colour used for the ASCII title banner AND the menu highlight / ">" symbol
accent_color = blue

# Colour of the footer hint text
footer_color = dark_gray

# Automatically compile after saving/closing the editor.
# Options: true, false
auto_compile = false
